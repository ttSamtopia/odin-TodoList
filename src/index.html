<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <header>
        <h1>Todo List</h1>
    </header>

    <div id="projects">
        <h2>Projects</h2>
        <ul id="project-list"></ul>

        <form id="project-form">
            <label for="project-title">Title</label>
            <input type="text" id="project-title" name="title" required>

            <label for="project-description">Description</label>
            <input type="text" id="project-description" name="description">

            <button type="submit">Add project</button>
        </form>
    </div>

    <div id="todos">
        <h2 id="todos-heading">Todos</h2>
        <ul id="todo-list"></ul>

        <form id="todo-form">
            <label for="todo-title">Title</label>
            <input type="text" id="todo-title" name="title" required>

            <label for="todo-description">Description</label>
            <input type="text" id="todo-description" name="description">

            <label for="todo-due-date">Due date</label>
            <input type="date" id="todo-due-date" name="dueDate" required>

            <label for="todo-priority">Priority</label>
            <select id="todo-priority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <button type="submit">Add todo</button>
        </form>
    </div>

    <div id="todo-details"></div>

    <script type="module" src="./index.js"></script>
</body>
</html>
